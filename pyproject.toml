[build-system]
requires = ["hatchling>=1.27.0", "uv-dynamic-versioning>=0.8.0"]
build-backend = "hatchling.build"

[project]
name = "ikonsub"
dynamic = ["version"]
description = "ikonsub: CLI subtitle translator with MKV extraction and a Finnish readability pipeline, using LLMs (Linux/macOS)"
readme = "readme.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
dependencies = [
    "python-dotenv",
    "srt",
    "pysubs2",
    "regex",
    "appdirs",
    "blinker",
    "httpx[socks]>=0.28",
    "subtitle_filter",
    "chardet",
    "filelock",
    "rich",
    "ffmpeg-progress-yield",
]

[project.optional-dependencies]
openai = ["openai>=3.42"]
gemini = ["google-genai>=2.34"]
claude = ["anthropic>=2.4"]
# Kept empty so existing `ikonsub[mkv]` install commands still resolve; the MKV
# dependencies are core dependencies.
mkv = []

[dependency-groups]
dev = [
    "babel",
    "basedpyright>=1.31.4",
    "pytest>=8.3.4",
    "ruff>=0.12.0",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
gpt-subtrans = "scripts.gpt_subtrans:main"
gemini-subtrans = "scripts.gemini_subtrans:main"
claude-subtrans = "scripts.claude_subtrans:main"
batch-translate = "scripts.batch_translate:main"
exsubs = "scripts.exsubs:main"
transubs = "scripts.transubs:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.hatch.build.targets.wheel]
packages = ["PySubtrans", "scripts", "instructions"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["PySubtrans", "scripts", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ALL"]

[tool.basedpyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "off"
reportAny = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
