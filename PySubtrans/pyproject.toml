[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysubtrans"
version = "1.5.6"
description = "Core subtitle translation toolkit used by ikonsub (derived from LLM-Subtrans)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "python-dotenv",
    "srt",
    "pysubs2",
    "regex",
    "babel",
    "appdirs",
    "blinker",
    "requests",
    "setuptools",
    "httpx",
    "httpx[socks]"
]

[project.optional-dependencies]
openai = [
    "openai"
]
gemini = [
    "google-genai"
]
claude = [
    "anthropic"
]

[project.urls]
Homepage = "https://github.com/tinof/ikonsub"
Documentation = "https://github.com/tinof/ikonsub/blob/main/PySubtrans/README.md"
Source = "https://github.com/tinof/ikonsub"
Issues = "https://github.com/tinof/ikonsub/issues"

[tool.setuptools]
packages = [
    "PySubtrans",
    "PySubtrans.Formats",
    "PySubtrans.Helpers",
    "PySubtrans.Providers",
    "PySubtrans.Providers.Clients"
]
package-dir = {"PySubtrans" = "."}
